<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mela Menagerie Quiz</title>
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#2b2a4c;--pri:#7048e8;--ok:#2e9e5b;--no:#e5484d;--soft:#ffe9b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1d33;--card:#2b2a4c;--ink:#fff8e7;--soft:#3b3963}}
:root[data-theme="dark"]{--bg:#1e1d33;--card:#2b2a4c;--ink:#fff8e7;--soft:#3b3963}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;text-align:center;padding:16px}
.w{max-width:560px;margin:0 auto}h1{font-size:1.6rem;margin:6px 0}.sub{opacity:.85;margin:0 0 12px}
.bar{height:14px;background:var(--soft);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .4s}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.q{font-size:1.35rem;margin:6px 0 14px;line-height:1.4}.big{font-size:2rem;color:var(--pri);font-weight:bold}
button{font:inherit;cursor:pointer}.o{display:block;width:100%;margin:10px 0;padding:14px;font-size:1.3rem;border-radius:16px;border:3px solid var(--pri);background:var(--card);color:var(--ink)}
.o:active{transform:scale(.98)}.o.ok{background:var(--ok);border-color:var(--ok);color:#fff}.o.no{background:var(--no);border-color:var(--no);color:#fff}
.go{padding:14px 30px;font-size:1.3rem;border:0;border-radius:30px;background:var(--pri);color:#fff;margin-top:8px}
.fb{min-height:3.2em;font-size:1.15rem;margin-top:6px}.top{display:flex;justify-content:space-between;font-size:1.1rem}
</style></head><body><div class="w"><h1>🎉 Mela Menagerie Quiz</h1><p class="sub">Year 3 · A party in India · Pages 53–55</p>
<div id="app"></div></div>
<script>
var Q=[{"q": "What is a <b>mela</b>?", "o": ["A fair at a festival", "A big cat", "A yummy cake"], "t": "A mela is a fair held during a Hindu festival.", "tag": "Mela Menagerie"}, {"q": "Which animals cooked curried pumpkin?", "o": ["The elephants", "The tigers", "The lions"], "t": "The elephants cooked curried pumpkin.", "tag": "Mela Menagerie"}, {"q": "What is <b>henna</b>?", "o": ["A reddish-brown dye for painting patterns", "A flat bread", "A small coin"], "t": "Henna is used to paint patterns on bodies.", "tag": "Mela Menagerie"}, {"q": "Who did the donkeys crown?", "o": ["Mule", "Cobra", "Prince Rama"], "t": "They crowned Mule their Maharaja.", "tag": "Mela Menagerie"}, {"q": "What is a <b>Maharaja</b>?", "o": ["An Indian king", "An Indian dish", "A type of music"], "t": "A Maharaja is an Indian king.", "tag": "Mela Menagerie"}, {"q": "What is <b>paratha</b>?", "o": ["Indian flat bread", "A salty-sweet jam", "A gathering of poets"], "t": "Paratha is Indian flat bread.", "tag": "Mela Menagerie"}, {"q": "<i>lions showed off paws decorated with delicate henna</i> — which sound is repeated?", "o": ["The d sound", "The m sound", "The s sound"], "t": "This is alliteration: the d sound repeats.", "tag": "Mela Menagerie"}, {"q": "What is <b>alliteration</b>?", "o": ["Words close together that start with the same sound", "Two lines that rhyme", "A reddish-brown dye"], "t": "Alliteration repeats a starting sound.", "tag": "Mela Menagerie"}, {"q": "What are <b>couplets</b>?", "o": ["Two lines that rhyme", "Two tigers", "Two coins"], "t": "Couplets are two lines that rhyme.", "tag": "Mela Menagerie"}, {"q": "Who sheltered under the hood of a cobra?", "o": ["Sun-shy frogs and mice", "Horses and camels", "Pelicans"], "t": "Frogs and mice stayed safe under the cobra.", "tag": "Mela Menagerie"}, {"q": "What is <b>chutney</b>?", "o": ["A salty and sweet jam made from vegetables", "A king", "Indian pop music"], "t": "Chutney is a salty and sweet jam.", "tag": "Mela Menagerie"}, {"q": "Add ing to <b>dance</b>", "o": ["dancing", "danceing", "dannceing"], "t": "Remove the e, then add ing!", "tag": "Mela Menagerie"}, {"q": "Add ed to <b>swap</b>", "o": ["swapped", "swaped", "swapted"], "t": "Double the last letter, then add ed!", "tag": "Mela Menagerie"}, {"q": "What does <b>recalling</b> mean?", "o": ["Remembering", "Dancing", "Cooking"], "t": "Recalling means remembering.", "tag": "Mela Menagerie"}, {"q": "Who built bridges, remembering Prince Rama?", "o": ["The monkeys", "The pelicans", "The lions"], "t": "The monkeys built bridges.", "tag": "Mela Menagerie"}, {"q": "What did the pelicans swallow?", "o": ["Swords with mango chutney and paratha", "Curried pumpkin", "Juicy papayas"], "t": "Pelicans swallowed swords with chutney and paratha!", "tag": "Mela Menagerie"}, {"q": "What did the tigers take a pot-shot at?", "o": ["Juicy papayas", "Mango chutney", "Henna"], "t": "The tigers aimed at juicy papayas for one paisa.", "tag": "Mela Menagerie"}, {"q": "Who pranced and danced a fantastic bhangra?", "o": ["Horses and camels", "Bears and cockatoos", "Frogs and mice"], "t": "Horses and camels did the bhangra.", "tag": "Mela Menagerie"}, {"q": "Who swapped couplets in a mini mushaira?", "o": ["Bears and cockatoos", "Lions", "Donkeys"], "t": "Bears and cockatoos swapped couplets.", "tag": "Mela Menagerie"}, {"q": "What is a <b>mushaira</b>?", "o": ["A gathering of poets", "An Indian king", "Indian flat bread"], "t": "A mushaira is a gathering of poets.", "tag": "Mela Menagerie"}, {"q": "What is <b>bhangra</b>?", "o": ["A type of Indian pop music", "A salty and sweet jam", "A small Indian coin"], "t": "Bhangra is Indian pop music.", "tag": "Mela Menagerie"}, {"q": "Who wrote <i>Mela Menagerie</i>?", "o": ["Debjani Chatterjee", "Edward Lear", "Rex Stone"], "t": "The poet is Debjani Chatterjee.", "tag": "Mela Menagerie"}, {"q": "Add <b>ing</b> to <b>help</b>", "o": ["helping", "helpping", "helpeing"], "t": "Just add ing!", "tag": "Mela Menagerie"}, {"q": "Add <b>ed</b> to <b>show</b>", "o": ["showed", "showwed", "showd"], "t": "Just add ed!", "tag": "Mela Menagerie"}, {"q": "Add <b>ed</b> to <b>crown</b>", "o": ["crowned", "crownned", "crowed"], "t": "Just add ed!", "tag": "Mela Menagerie"}, {"q": "Add <b>ing</b> to <b>sail</b>", "o": ["sailing", "sailling", "saling"], "t": "Long vowel sound: just add ing!", "tag": "Mela Menagerie"}, {"q": "Which word means <i>danced with knees high</i>?", "o": ["pranced", "swallowed", "sheltered"], "t": "Pranced is for a horse that dances with high knees.", "tag": "Mela Menagerie"}, {"q": "What does <b>sheltered</b> mean?", "o": ["Stayed somewhere safe", "Danced", "Remembered"], "t": "Sheltered means stayed somewhere safe.", "tag": "Mela Menagerie"}, {"q": "Does <i>Mela Menagerie</i> rhyme?", "o": ["No, it does not rhyme", "Yes, every line rhymes", "Only the title rhymes"], "t": "The poet uses rhythm and alliteration, not rhyme.", "tag": "Mela Menagerie"}];var i=0,s=0,lock=false,app=document.getElementById("app");
function sh(a){return a.map(function(x){return[Math.random(),x]}).sort(function(a,b){return a[0]-b[0]}).map(function(p){return p[1]})}
function start(){i=0;s=0;Q=sh(Q);show()}
function intro(){app.innerHTML='<div class="card"><div class="big">🐯🐘🐸</div><p class="q">Let’s go to the animal party! Answer the questions about the poem.</p><button class="go" onclick="start()">Let’s play! ▶</button></div>'}
function show(){lock=false;var q=Q[i];var os=sh(q.o.map(function(t,k){return{t:t,k:k}}));
var h='<div class="top"><span>Question '+(i+1)+' / '+Q.length+'</span><span>⭐ '+s+'</span></div><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="card">'+(q.tag?'<div class="sub">'+q.tag+'</div>':'')+'<p class="q">'+q.q+'</p>';
os.forEach(function(o){h+='<button class="o" data-k="'+o.k+'">'+o.t+'</button>'});
app.innerHTML=h+'<div class="fb" id="fb"></div></div>';
Array.prototype.forEach.call(app.querySelectorAll(".o"),function(b){b.onclick=function(){pick(b)}})}
function pick(b){if(lock)return;lock=true;var q=Q[i],ok=+b.dataset.k===0;
Array.prototype.forEach.call(app.querySelectorAll(".o"),function(x){if(+x.dataset.k===0)x.classList.add("ok")});
if(ok){s++;document.getElementById("fb").innerHTML='🎉 Great job! '+q.t}else{b.classList.add("no");document.getElementById("fb").innerHTML='💪 Nice try! '+q.t}
var n=document.createElement("button");n.className="go";n.textContent=i+1<Q.length?"Next ▶":"Finish 🏁";n.onclick=function(){i++;i<Q.length?show():end()};app.firstChild.nextSibling&&0;document.querySelector(".card").appendChild(n)}
function end(){var st=s>=Q.length*.8?"🏆 Superstar!":s>=Q.length*.5?"🌟 Well done!":"🌈 Good try! Play again!";
app.innerHTML='<div class="card"><div class="big">'+st+'</div><p class="q">You got '+s+' out of '+Q.length+' stars!</p><button class="go" onclick="start()">Play again 🔁</button></div>'}
intro();
</script></body></html>
